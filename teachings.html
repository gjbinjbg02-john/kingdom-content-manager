<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111827">
<title>7-Day Teaching Programme | Kingdom Content Manager</title>

<style>
:root {
  --dark: #111827;
  --gold: #eab308;
  --light: #f3f4f6;
  --white: #ffffff;
  --green: #166534;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--light);
  color: #1f2937;
  font-family: Arial, sans-serif;
  line-height: 1.6;
}
header {
  background: var(--dark);
  color: white;
  padding: 22px 16px;
  border-bottom: 4px solid var(--gold);
}
header h1 { margin: 0 0 6px; font-size: 23px; }
header p { margin: 0; color: #e5e7eb; }
main { max-width: 900px; margin: auto; padding: 16px; }
.card {
  background: white;
  padding: 18px;
  margin: 16px 0;
  border-radius: 12px;
  box-shadow: 0 2px 8px #0000000d;
}
h2, h3 { color: var(--dark); }
label {
  display: block;
  font-weight: bold;
  margin: 14px 0 5px;
}
input, textarea, select {
  width: 100%;
  padding: 12px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font: inherit;
  background: white;
}
textarea { min-height: 110px; resize: vertical; }
button, .back {
  display: inline-block;
  border: 0;
  padding: 11px 14px;
  border-radius: 8px;
  margin: 7px 5px 3px 0;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  text-decoration: none;
}
.primary { background: var(--dark); color: white; }
.gold { background: var(--gold); color: #111827; }
.green { background: var(--green); color: white; }
.gray { background: #e5e7eb; color: #111827; }
.red { background: #fee2e2; color: #991b1b; }
.day
